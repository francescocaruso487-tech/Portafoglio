<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Il mio portafoglio</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#070b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0b111f;--bg2:#10182b;--card:#131c31;--card2:#18233b;--tx:#ece8dd;--mu:#8f9bb3;--ln:#243250;--ac:#d4a84f;--ac2:#f0cf86;--ok:#43c6a6;--wa:#e9b44c;--er:#ff7a85;--bar:#ffffff14;--r:16px}
html{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:92px;font-variant-numeric:tabular-nums}
header{padding:calc(env(safe-area-inset-top) + 18px) 18px 4px}
h1{font-size:19px;font-weight:600;margin:0;letter-spacing:.2px}
.ver{display:inline-block;font-size:11.5px;color:var(--ac2);background:#d4a84f1f;border:1px solid #d4a84f40;border-radius:20px;padding:2px 10px;margin-bottom:6px}
.sub{color:var(--mu);font-size:12.5px;margin-top:2px}
main{padding:8px 14px 24px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:15px;margin:12px 0}
.card h2,h2.sec{font-size:15px;font-weight:600;margin:0 0 10px}
.mu{color:var(--mu);font-size:13px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:4px 0}
.bar{height:6px;border-radius:4px;background:var(--bar);margin:3px 0 9px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:4px}
.tag{display:inline-block;font-size:11.5px;border:1px solid var(--ln);border-radius:20px;padding:1px 9px;margin:3px 5px 0 0;color:var(--mu)}
.hero{border-radius:26px;padding:20px 18px 6px;margin:10px 0 6px;border:1px solid #2c3b5e;background:radial-gradient(120% 90% at 85% 0%,#22345f 0%,transparent 60%),linear-gradient(180deg,#16213b,#101a2f);overflow:hidden}
.hero .lab{color:var(--mu);font-size:13px}
.hero .tot{font-size:44px;font-weight:300;letter-spacing:-1.5px;line-height:1.05;margin:2px 0 10px}
.hero .tot small{font-size:22px;color:var(--ac2);font-weight:400;margin-left:2px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:12.5px;border-radius:20px;padding:4px 11px;background:#ffffff10;color:var(--tx)}
.pill.g{background:#43c6a622;color:var(--ok)}
.pill.a{background:#d4a84f26;color:var(--ac2)}
.gsvg{display:block;width:100%;height:auto;margin:6px -2px 0}
.gline{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.6s .15s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sechead{display:flex;justify-content:space-between;align-items:center;margin:22px 4px 8px}
.sechead h2{margin:0;font-size:15px;font-weight:600}
.chips{display:flex;gap:6px}
.chip{border:1px solid var(--ln);background:none;color:var(--mu);border-radius:20px;padding:5px 12px;font-size:12.5px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#241a05;font-weight:600}
.dwrap{display:flex;gap:16px;align-items:center;padding:4px 2px}
.dwrap svg{flex:0 0 150px;width:150px;height:150px}
.leg{flex:1;min-width:0}
.leg .it{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13.5px}
.leg .dot,.dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;display:inline-block}
.leg .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:14px;padding:2px 14px 10px;margin:0 -14px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.pc{scroll-snap-align:start;flex:0 0 158px;min-width:0;border-radius:18px;padding:13px 13px 12px;border:1px solid var(--ln);background:var(--card);position:relative;overflow:hidden}
.pc::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--c)}
.pc .n{font-size:13px;color:var(--mu);margin-top:4px}
.pc .v{font-size:21px;font-weight:500;margin:2px 0 6px;letter-spacing:-.3px}
.pc .m{font-size:12px;color:var(--mu)}
.sc{display:flex;gap:12px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--ln)}
.sc:last-child{border-bottom:0}
.sc .t{flex:1;min-width:0}
.sc .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .d{font-size:12.5px;padding:3px 10px;border-radius:20px;background:#ffffff10;white-space:nowrap}
.sc .d.s{background:#d4a84f26;color:var(--ac2)}
.sc .d.x{background:#43c6a622;color:var(--ok)}
nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:#101a2fee;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--ln);border-radius:22px;display:flex;z-index:5;padding:5px;max-width:700px;margin:0 auto}
nav button{flex:1;min-width:0;border:0;background:none;color:var(--mu);padding:7px 1px 6px;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:16px}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ac2);background:#d4a84f1c}
button.pri{background:linear-gradient(135deg,var(--ac2),var(--ac));color:#241a05;border:0;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:650}
button.sec{background:none;color:var(--ac2);border:1px solid var(--ln);border-radius:12px;padding:10px 14px;font-size:14px}
button.dan{background:none;color:var(--er);border:1px solid var(--ln);border-radius:12px;padding:10px 14px;font-size:14px}
.mini{background:none;color:var(--ac2);border:1px solid var(--ln);border-radius:10px;padding:6px 11px;font-size:13px;margin:9px 6px 0 0}
.acts{display:flex;flex-wrap:wrap}
.fab{position:fixed;right:18px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:6;border-radius:30px;padding:13px 20px;box-shadow:0 8px 24px #0009}
.pos{cursor:pointer}
.alert{border-left:4px solid var(--wa)}.alert.er{border-left-color:var(--er)}.alert.ok{border-left-color:var(--ok)}.alert.in{border-left-color:var(--ac)}
.alert b{display:block;margin-bottom:2px}
.modal{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg2);border:1px solid var(--ln);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
label{display:block;font-size:13px;color:var(--mu);margin:11px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--ln);border-radius:12px;padding:11px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--tx);font-size:15px}.chk input{width:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;padding:34px 12px;color:var(--mu)}
pre.ai{white-space:pre-wrap;font:inherit;margin:8px 0 0}
.note{font-size:12px;color:var(--mu);margin-top:6px}
.logr{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--ln)}
.grp{display:flex;align-items:center;gap:8px;margin:20px 4px 2px;font-size:14px}
.grp b{font-weight:600}.grp span.t{margin-left:auto;color:var(--mu)}
button.pri.sm,.acts2 button{margin:0}.acts2{display:flex;gap:8px;flex-wrap:wrap;margin:8px 2px}.neg{color:var(--er)}.posv{color:var(--ok)}
@media (prefers-reduced-motion:reduce){.gline{animation:none;stroke-dashoffset:0}}
/* ===== v3.2 vetro scuro (stile One UI) ===== */
:root{--bg:#070b14;--bg2:#0e1524;--card:#ffffff0d;--card2:#ffffff12;--ln:#ffffff1f;--r:26px;--gl:blur(22px) saturate(150%)}
body{background:#070b14;background-image:radial-gradient(60% 40% at 15% 0%,#2a3f7a55 0%,transparent 70%),radial-gradient(55% 35% at 100% 18%,#d4a84f2e 0%,transparent 70%),radial-gradient(70% 45% at 0% 100%,#3a2a6b40 0%,transparent 70%);background-attachment:fixed;background-repeat:no-repeat}
.card,.pc,.sheet,nav,.hero{-webkit-backdrop-filter:var(--gl);backdrop-filter:var(--gl)}
.card{background:linear-gradient(160deg,#ffffff14,#ffffff07);border:1px solid #ffffff1f;box-shadow:inset 0 1px 0 #ffffff26,0 10px 30px #0000004d;padding:18px}
.hero{border-radius:32px;border:1px solid #ffffff26;background:radial-gradient(120% 90% at 85% 0%,#d4a84f33 0%,transparent 58%),linear-gradient(160deg,#ffffff18,#ffffff08);box-shadow:inset 0 1px 0 #ffffff33,0 16px 40px #0006}
.pc{border-radius:24px;background:linear-gradient(160deg,#ffffff14,#ffffff07);border:1px solid #ffffff1f;box-shadow:inset 0 1px 0 #ffffff26}
.pill{background:#ffffff14;border:1px solid #ffffff14}
nav{left:12px;right:12px;border-radius:30px;background:#0e1526b8;border:1px solid #ffffff26;box-shadow:inset 0 1px 0 #ffffff26,0 12px 34px #000a;padding:6px}
nav button{border-radius:24px;transition:background .2s,color .2s}
nav button.on{background:linear-gradient(160deg,#f0cf8638,#d4a84f1f);box-shadow:inset 0 1px 0 #ffffff33,0 0 18px #d4a84f33}
button.pri{background:linear-gradient(160deg,#f0cf8648,#d4a84f2b);color:#ffe9b3;border:1px solid #f0cf8680;border-radius:18px;box-shadow:inset 0 1px 0 #ffffff55,0 8px 22px #d4a84f33;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);text-shadow:0 1px 8px #0007}
button.sec,button.dan,.mini{background:#ffffff12;border:1px solid #ffffff26;border-radius:18px;box-shadow:inset 0 1px 0 #ffffff22;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.mini{border-radius:16px}
button{transition:transform .12s ease,background .2s}
button:active{transform:scale(.96)}
.fab{border-radius:34px;box-shadow:inset 0 1px 0 #ffffff55,0 12px 30px #000a,0 0 24px #d4a84f40}
.chip{background:#ffffff0d;border-color:#ffffff22}
.chip.on{background:linear-gradient(160deg,#f0cf86,#d4a84f);color:#241a05}
.modal{background:#02050cb3;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet{background:linear-gradient(180deg,#1a2338e6,#0e1524f2);border:1px solid #ffffff26;border-bottom:0;border-radius:34px 34px 0 0;box-shadow:inset 0 1px 0 #ffffff33}
input,select,textarea{background:#ffffff10;border:1px solid #ffffff22;border-radius:16px;box-shadow:inset 0 1px 0 #ffffff12}
.alert{border-left-width:1px;border-left-color:#ffffff1f;position:relative}
.alert::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;background:var(--wa)}
.alert.er::before{background:var(--er)}.alert.ok::before{background:var(--ok)}.alert.in::before{background:var(--ac)}
.ver{background:#ffffff12;border-color:#ffffff26;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.bar{background:#ffffff1a}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card,.pc,.hero{background:#131c31}.sheet{background:#0e1524}nav{background:#101a2f}}
@media (prefers-reduced-motion:reduce){button{transition:none}button:active{transform:none}}
/* ===== v3.7 stile iOS (Liquid Glass) ===== */
html.ios{color-scheme:light dark;--bg:#f2f2f7;--bg2:#fff;--card:#ffffffb8;--card2:#ffffffd6;--tx:#000;--mu:#6c6c70;--ln:#3c3c4333;--ac:#0062cc;--ac2:#0062cc;--acb:#0062cc;--ok:#1e7a35;--wa:#a84b00;--er:#d70015;--bar:#78788029;--r:22px;--gl:blur(30px) saturate(180%);--fill:#7676801f;--hi:#ffffffcc}
@media (prefers-color-scheme:dark){html.ios{--bg:#000;--bg2:#1c1c1e;--card:#1c1c1ebd;--card2:#2c2c2ed6;--tx:#fff;--mu:#98989f;--ln:#54545899;--ac:#0a84ff;--ac2:#0a84ff;--acb:#0a6ed1;--ok:#30d158;--wa:#ff9f0a;--er:#ff453a;--bar:#7878805c;--fill:#7676803d;--hi:#ffffff1f}}
html.ios body{background:var(--bg);background-image:radial-gradient(70% 38% at 0% 0%,#0a84ff26,transparent 70%),radial-gradient(60% 32% at 100% 14%,#bf5af220,transparent 70%),radial-gradient(70% 40% at 50% 100%,#30d15818,transparent 70%);background-attachment:fixed;background-repeat:no-repeat;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;letter-spacing:-.011em}
html.ios h1{font-size:34px;font-weight:700;letter-spacing:-.03em;margin-top:6px}
html.ios h2{font-weight:600;letter-spacing:-.02em}
html.ios .ver{background:var(--fill);border:0;color:var(--mu);font-weight:500}
html.ios .card,html.ios .pc,html.ios .hero{background:var(--card);border:.5px solid var(--hi);box-shadow:0 1px 0 var(--hi) inset,0 6px 24px #0000001a;border-radius:var(--r)}
html.ios .hero{border-radius:28px;background:var(--card)}
html.ios nav{left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 10px);border-radius:34px;background:var(--card);border:.5px solid var(--hi);box-shadow:0 1px 0 var(--hi) inset,0 10px 34px #00000033;padding:5px}
html.ios nav button{color:var(--mu);border-radius:28px;font-weight:500}
html.ios nav button.on{color:var(--ac);background:var(--fill);box-shadow:none}
html.ios button.pri{background:var(--acb);color:#fff;border:0;border-radius:999px;box-shadow:none;text-shadow:none;font-weight:600;-webkit-backdrop-filter:none;backdrop-filter:none}
html.ios button.sec,html.ios .mini{background:var(--fill);color:var(--ac);border:0;border-radius:999px;box-shadow:none;font-weight:500}
html.ios button.dan{background:var(--fill);color:var(--er);border:0;border-radius:999px;box-shadow:none}
html.ios .chip{background:var(--fill);border:0;color:var(--tx)}
html.ios .chip.on{background:var(--ac);color:#fff;font-weight:600}
html.ios .pill{background:var(--fill);border:0}
html.ios .pill.a{background:#007aff1f;color:var(--ac)}
html.ios .sc .d.s{background:#007aff1f;color:var(--ac)}
html.ios input,html.ios select,html.ios textarea{background:var(--fill);border:0;border-radius:12px;box-shadow:none;color:var(--tx)}
html.ios .modal{background:#0000004d}
html.ios .sheet{background:var(--card2);border:.5px solid var(--hi);border-bottom:0;border-radius:30px 30px 0 0;box-shadow:0 1px 0 var(--hi) inset}
html.ios .fab{background:var(--ac);color:#fff;border:0;box-shadow:0 10px 26px #007aff66}
html.ios .bar>i{background:var(--ac)}
html.ios a{color:var(--ac)}
html.ios .alert{border-left-width:.5px}
html.ios .alert.in::before{background:var(--ac)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){html.ios .card,html.ios .pc,html.ios .hero,html.ios nav{background:var(--bg2)}}
#main{overflow-wrap:anywhere}
input[type=range]{width:100%;accent-color:var(--ac)}
</style>
<script>try{if(localStorage.getItem('portafoglio_tema')!=='oro')document.documentElement.classList.add('ios')}catch(e){document.documentElement.classList.add('ios')}</script>

function num(x){var n=parseFloat(String(x).replace(',','.'));return isFinite(n)?n:0}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function eur(n){return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0,useGrouping:'always'}).format(n)}
function eur2(n){return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',useGrouping:'always'}).format(n)}
function pc(n){return (Math.round(n*10)/10).toString().replace('.',',')+'%'}
function dt(s){var d=new Date(s);return d.toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'})}
function sum(a,f){var t=0;for(var i=0;i<a.length;i++)t+=f(a[i]);return t}

/* CALC-START */
function yearsTo(p){
  if(p.scad){var d=(new Date(p.scad).getTime()-Date.now())/(864e5*365.25);return Math.max(d,0)}
  if(num(p.orizz)>0)return num(p.orizz);
  return null;
}
function tEff(p){var t=num(p.tasso),k=num(p.tetto),c=num(p.cap);if(k>0&&c>k&&p.tassoOltre!==''&&p.tassoOltre!=null)return (k*t+(c-k)*num(p.tassoOltre))/c;return t}
function valueAt(p,Y){
  var T=yearsTo(p);var t=T==null?Y:Math.min(Y,T);
  var r=(tEff(p)-num(p.costi))/100;if(r<-0.99)r=-0.99;
  var i=Math.pow(1+r,1/12)-1;var n=Math.round(t*12);
  var cap=num(p.cap),pm=num(p.pmt);
  var fv=cap*Math.pow(1+i,n);
  if(pm){fv+= (Math.abs(i)<1e-12)?pm*n:pm*(Math.pow(1+i,n)-1)/i}
  var base=num(p.nom)>0?num(p.nom):cap;
  var inv=base+pm*n;var gain=fv-inv;var tax=num(p.tassa)/100;
  return {lordo:fv,netto:gain>0?fv-gain*tax:fv,inv:inv};
}

function normalize(){
  if(!S||!Array.isArray(S.pos))S={pos:[],set:{}};
  S.set=S.set||{};S.set.target=S.set.target||{};

  if(S.set.cashback==null)S.set.cashback=1;
  if(!Array.isArray(S.log))S.log=[];if(!Array.isArray(S.hist))S.hist=[];if(!Array.isArray(S.mov))S.mov=[];if(!Array.isArray(S.fisse))S.fisse=[];if(!S.nos||typeof S.nos!=='object')S.nos={};if(!Array.isArray(S.ric))S.ric=[];
}

function histSnap(){var t=sum(S.pos,function(p){return num(p.cap)});if(!(t>0))return;if(!Array.isArray(S.hist))S.hist=[];var d=today(),l=S.hist[S.hist.length-1];t=Math.round(t*100)/100;if(l&&l.d===d)l.v=t;else S.hist.push({d:d,v:t});if(S.hist.length>1000)S.hist=S.hist.slice(-1000)}
function histCard(){
  var H=Array.isArray(S.hist)?S.hist:[];
  if(H.length<2)return '<div class="note" style="margin:0 0 12px">Da oggi l’app registra il patrimonio ogni giorno: il grafico dell’andamento reale comparirà dal secondo giorno.</div>';
  var W=320,Ht=110,pl=8,min=Infinity,max=-Infinity;H.forEach(function(x){if(x.v<min)min=x.v;if(x.v>max)max=x.v});if(max===min){max+=1;min-=1}
  var t0=new Date(H[0].d).getTime(),t1=new Date(H[H.length-1].d).getTime()||t0+1,sp=Math.max(1,t1-t0);
  var pts=H.map(function(x){return [pl+(new Date(x.d).getTime()-t0)/sp*(W-2*pl),Ht-pl-(x.v-min)/(max-min)*(Ht-2*pl)]});
  var path='M'+pts.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(' L');
  var d=H[H.length-1].v-H[0].v;

   '<svg viewBox="0 0 '+W+' '+Ht+'" role="img" aria-label="Andamento del patrimonio registrato giorno per giorno, da '+esc(eur(H[0].v))+' a '+esc(eur(H[H.length-1].v))+'" style="width:100%;height:auto;display:block;margin-top:6px"><path d="'+path+'" fill="none" stroke="var(--ac)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'+

function donut(map,tot,cmap){

    cum+=v;
    leg+='<div class="it"><span class="dot" style="background:'+c+'"></span><span class="nm">'+esc(n)+'</span><b>'+pc(v)+'</b></div>'});
  return '<div class="dwrap"><svg viewBox="0 0 42 42" role="img" aria-label="Ripartizione del patrimonio"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="#ffffff10" stroke-width="4.2"/>'+segs+

}
function growth(P){
  var N=20,W=340,H=150,pl=6,pr=10,pt=22,pb=22,net=[],inv=[],y,i;
  for(y=0;y<=N;y++){var a=0,b=0;P.forEach(function(p){var v=valueAt(p,y);a+=v.netto;b+=v.inv});net.push(a);inv.push(b)}
  var mx=Math.max.apply(null,net.concat(inv)),mn=Math.min.apply(null,net.concat(inv));var span=(mx-mn)||mx||1;mn=Math.max(0,mn-span*0.15);mx=mx+span*0.08;
  var X=function(v){return pl+(W-pl-pr)*v/N},Y=function(v){return pt+(H-pt-pb)*(1-(v-mn)/((mx-mn)||1))};
  var line=function(arr){return arr.map(function(v,j){return (j?'L':'M')+X(j).toFixed(1)+' '+Y(v).toFixed(1)}).join(' ')};
  var area=line(net)+' L'+X(N).toFixed(1)+' '+(H-pb)+' L'+X(0).toFixed(1)+' '+(H-pb)+' Z';
  var marks=[1,5,10,20].map(function(m){var cx=X(m),cy=Y(net[m]);var anchor=m===20?'end':'middle';var tx=m===20?cx+2:cx;
    return '<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="3.2" fill="#0b111f" stroke="#f0cf86" stroke-width="1.6"/><text x="'+tx.toFixed(1)+'" y="'+(cy-8).toFixed(1)+'" text-anchor="'+anchor+'" fill="#ece8dd" font-size="9.5">'+esc(eurC(net[m]))+'</text>'}).join('');
  var xl=[[0,'oggi'],[5,'5 anni'],[10,'10 anni'],[20,'20 anni']].map(function(a){return '<text x="'+X(a[0]).toFixed(1)+'" y="'+(H-6)+'" text-anchor="'+(a[0]===0?'start':a[0]===20?'end':'middle')+'" fill="#8f9bb3" font-size="9.5">'+a[1]+'</text>'}).join('');
  return '<svg class="gsvg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Valore netto stimato nei prossimi 20 anni"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4a84f" stop-opacity=".38"/><stop offset="1" stop-color="#d4a84f" stop-opacity="0"/></linearGradient></defs>'+
   '<path d="'+area+'" fill="url(#ga)"/><path d="'+line(inv)+'" fill="none" stroke="#8f9bb3" stroke-width="1.2" stroke-dasharray="3 4" opacity=".8"/>'+
   '<path class="'+(animGrowth?'gline':'')+'" d="'+line(net)+'" fill="none" stroke="#f0cf86" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" pathLength="1000"/>'+marks+xl+'</svg>';
}

function bars(map,tot){
  var k=Object.keys(map).sort(function(a,b){return map[b]-map[a]});
  return k.map(function(n){var v=map[n];var w=tot?v/tot*100:0;

}

    var refs=P.filter(function(p){return p.tipo==='conto'&&num(p.tasso)>0.5}).sort(function(a,b){return num(b.tasso)-num(a.tasso)});
    var txt=eur(idleCap)+' ('+pc(idleCap/tot*100)+' del totale) non rendono quasi nulla.';
    if(refs.length){var r=refs[0];txt+=' Al tasso del tuo «'+r.nome+'» ('+pc(num(r.tasso))+') renderebbero circa '+eur(idleCap*num(r.tasso)/100)+' lordi all\'anno.'}

var PKEY='portafoglio_push',PUSH_KO=false,REPO='https://github.com/francescocaruso487-tech/portafoglio';
function pushInfo(){try{return JSON.parse(localStorage.getItem(PKEY))}catch(e){return null}}
function pushOk(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window&&window.crypto&&crypto.subtle}
function b64u(buf){var a=new Uint8Array(buf),t='';for(var i=0;i<a.length;i++)t+=String.fromCharCode(a[i]);return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(x){var t=x.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';t=atob(t);var a=new Uint8Array(t.length);for(var i=0;i<t.length;i++)a[i]=t.charCodeAt(i);return a}
function nuoveChiavi(){
  return crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']).then(function(k){
    return Promise.all([crypto.subtle.exportKey('raw',k.publicKey),crypto.subtle.exportKey('jwk',k.privateKey)]).then(function(x){return {pub:b64u(x[0]),priv:x[1].d}})});
}
function pushAttiva(){
  var msg=function(t){var m=document.getElementById('pushMsg');if(m)m.textContent=t};
  msg('Attivo…');
  Notification.requestPermission().then(function(perm){
    if(perm!=='granted'){msg('Permesso negato: abilita le notifiche per questa app nelle impostazioni del telefono, poi riprova.');return}
    var old=pushInfo();
    return Promise.all([navigator.serviceWorker.ready,old&&old.pub&&old.priv?old:nuoveChiavi()]).then(function(x){
      var reg=x[0],k=x[1];
      return reg.pushManager.getSubscription().then(function(sub){
        if(sub&&sub.options&&sub.options.applicationServerKey&&b64u(sub.options.applicationServerKey)!==k.pub)return sub.unsubscribe().then(function(){return null});
        return sub;
      }).then(function(sub){return sub||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:unb64u(k.pub)})}).then(function(sub){
        var cambiato=!!(old&&old.endpoint&&old.endpoint!==sub.endpoint);
        var info={pub:k.pub,priv:k.priv,endpoint:sub.endpoint,code:JSON.stringify({v:1,sub:sub.toJSON(),pub:k.pub,priv:k.priv})};
        localStorage.setItem(PKEY,JSON.stringify(info));PUSH_KO=false;render();
        if(ghTok()){pushPubblica(info,function(r){msg(r==='ok'?'Fatto: iscrizione inviata a GitHub in automatico.':'Iscrizione attiva, ma l\u2019invio a GitHub non \u00e8 riuscito: controlla il token.')});return}
        msg(cambiato?'Il codice è cambiato: aggiorna il secret PUSH_CONFIG su GitHub.':'Fatto. Ora segui i passaggi qui sopra.');
      });
    });
  }).catch(function(){msg('Attivazione non riuscita. Apri l\'app installata, con la connessione attiva, e riprova.')});
}
var GKEY='portafoglio_gh',GAPI='https://api.github.com/repos/francescocaruso487-tech/Portafoglio/issues';
function ghTok(){try{return localStorage.getItem(GKEY)||''}catch(e){return ''}}
function pushPubblica(info,done){
  var t=ghTok();if(!t||!info){if(done)done('manca');return}
  var sub;try{sub=JSON.parse(info.code).sub}catch(e){if(done)done('err');return}
  fetch(GAPI,{method:'POST',headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({title:'iscrizione',body:'Iscrizione notifiche creata dall\u2019app. Non modificare.\n\n```json\n'+JSON.stringify({endpoint:sub.endpoint,keys:sub.keys})+'\n```'})})
  .then(function(r){if(!r.ok)throw new Error(r.status);info.pubblicato=info.endpoint;localStorage.setItem(PKEY,JSON.stringify(info));if(done)done('ok')}).catch(function(){if(done)done('err')});
}
function ghSalva(){

  if(!/^(github_pat_|ghp_)[A-Za-z0-9_]+$/.test(v)){if(m)m.textContent='Il codice non sembra un token GitHub: deve iniziare con github_pat_.';return}
  if(!pushInfo()){if(m)m.textContent='Prima tocca "Attiva notifiche".';return}
  try{localStorage.setItem(GKEY,v)}catch(e){}
  if(m)m.textContent='Invio…';
  pushPubblica(pushInfo(),function(r){if(m)m.textContent=r==='ok'?'Fatto: GitHub ha ricevuto l\u2019iscrizione. Non devi pi\u00f9 copiare nulla.':'Invio non riuscito: controlla che il token abbia "Issues: Read and write" sul repository Portafoglio.';render()});
}
function pushCopia(){

function pushControlla(){
  var i=pushInfo();if(!i||!pushOk())return;
  navigator.serviceWorker.ready.then(function(r){return r.pushManager.getSubscription().then(function(sub){
    if(!sub&&Notification.permission==='granted'&&i.pub)return r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:unb64u(i.pub)}).catch(function(){return null});
    return sub})}).then(function(sub){
    if(sub&&sub.endpoint!==i.endpoint){i.endpoint=sub.endpoint;i.code=JSON.stringify({v:1,sub:sub.toJSON(),pub:i.pub,priv:i.priv});try{localStorage.setItem(PKEY,JSON.stringify(i))}catch(e){}}
    if(sub&&ghTok()&&i.pubblicato!==sub.endpoint)pushPubblica(i);
    var ko=!sub||Notification.permission!=='granted'||(!ghTok()&&i.copiato!==sub.endpoint);
    if(ko!==PUSH_KO){PUSH_KO=ko;if(ko)toast('Le notifiche vanno riattivate: apri Dati.');if(tab==='dati')render()}
  }).catch(function(){});
}

function monthsTo(d){var a=new Date(d+'T12:00:00'),n=new Date();return Math.max(0,(a-n)/2629800000)}
function offCalc(o,amt,hor){
  var port=(o.max>0&&amt>o.max)?o.max:amt;
  var nr=o.tasso*(1-o.tassa/100)-(o.bollo?0.2:0);
  var tot,note='';
  if(o.mesi>0){var m=Math.min(o.mesi,hor);tot=port*nr/100*m/12;if(hor>o.mesi)tot+=port*BASE_NET/100*(hor-o.mesi)/12}
  else if(o.promoFine){var mp=Math.min(hor,monthsTo(o.promoFine));tot=port*nr/100*mp/12+port*BASE_NET/100*(hor-mp)/12}
  else tot=port*nr/100*hor/12;
  return {port:port,nr:nr,anno:port*nr/100,tot:tot,fuori:amt-port,stretto:o.mesi>hor}
}
function liquidPos(){return S.pos.filter(function(p){return (p.tipo==='conto'||p.tipo==='fermi')&&!p.bloccato&&num(p.cap)>0})}
function posNet(p){return tEff(p)*(1-num(p.tassa)/100)}
function dmList(amt,hor){
  if(!OFF)return {ok:[],esc:0};
  var ok=[],esc=0;
  OFF.offerte.forEach(function(o){
    if(o.non_per_me||o.rischio>DM.risk||(o.promoFine&&monthsTo(o.promoFine)<=0)){esc++;return}
    if(DM.liq&&o.mesi>0){esc++;return}
    if(amt<(o.min||0)){esc++;return}
    var c=offCalc(o,amt,hor);
    if(c.stretto){esc++;return}
    ok.push({o:o,c:c})
  });
  ok.sort(function(a,b){return b.c.tot-a.c.tot});
  return {ok:ok,esc:esc}
}

     '<div style="margin-top:6px">'+o.tasso.toFixed(2).replace('.',',')+'% lordo → <b>'+c.nr.toFixed(2).replace('.',',')+'% netto</b> (tasse '+o.tassa.toString().replace('.',',')+'%'+(o.bollo?' e bollo 0,20%':'')+') ≈ '+eur(c.anno)+'/anno</div>'+
     cf+'<div class="mu" style="margin-top:6px">'+esc(o.garanzia)+(o.req?' · '+esc(o.req):'')+'</div>'+
     (w.length?'<div class="mu" style="margin-top:4px;color:var(--wa,#e0b04a)">'+esc(w.join(' · '))+'</div>':'')+
     '<div class="mu" style="margin-top:4px">'+esc(sc)+'</div>'+
     (offVerifica(o)?'<div class="mu" style="margin-top:4px;font-size:12px">'+esc(offVerifica(o))+'</div>':'')+
     (/^https?:/.test(o.fonte)?'<div style="margin-top:6px"><a href="'+esc(o.fonte)+'" target="_blank" rel="noopener" style="color:var(--ac)">Fonte e dettagli</a></div>':'')+'</div>'
  });
  if(L.esc)h+='<div class="mu">'+L.esc+' offerte escluse da rischio, liquidità, importo minimo o vincolo più lungo dell\'orizzonte.</div>';
  /* soldi già tuoi */
  var mv=[];

    if(bo)mv.push({p:x.p,n:x.n,bo:bo})

function pad(n){return (n<10?'0':'')+n}
function pmonthLen(y,m){return new Date(y,m+1,0).getDate()}
function pacKey(y,m){while(m<0){m+=12;y--}while(m>11){m-=12;y++}return y+'-'+pad(m+1)}
function nextOccA(g,mo){var n=new Date(),y=n.getFullYear(),t=today();var c=function(y){return y+'-'+pad(mo)+'-'+pad(Math.min(g,pmonthLen(y,mo-1)))};var x=c(y);if(x<t)x=c(y+1);return x}
function nextOcc(g){
  var n=new Date(),y=n.getFullYear(),m=n.getMonth(),t=today();
  var cand=function(y,m){return y+'-'+pad(m+1)+'-'+pad(Math.min(g,pmonthLen(y,m)))};
  var c=cand(y,m);if(c<t){m++;if(m>11){m=0;y++}c=cand(y,m)}return c;
}

  }).catch(function(){if(man)toast('Non riesco a leggere i prezzi ora. Riprova tra poco.')}).then(function(){pxBusy=false});
}
function dnum(s){return Math.round(new Date(s+'T12:00:00').getTime()/864e5)}
var ACC=['conto','fermi','staking'];
function accrues(p){return ACC.indexOf(p.tipo)>=0&&tEff(p)>0&&num(p.cap)>0}
function runInt(){
  var t=today(),changed=false;
  S.pos.forEach(function(p){
    if(ACC.indexOf(p.tipo)<0)return;
    if(!p.accDa){p.accDa=t;changed=true;return}
    var n=dnum(t)-dnum(p.accDa);if(n<=0)return;if(n>400)n=400;
    for(var i=0;i<n;i++){
      if(!accrues(p))break;
      var d=tEff(p)/100/365,c0=num(p.cap),inc;
      if(p.tipo==='staking'){
        if(num(p.qty)>0&&p.cg){p.qty=num(p.qty)*(1+d);inc=p.px>0?num(p.qty)*p.px-c0:c0*d;p.cap=c0+inc}
        else{inc=c0*d;p.cap=c0+inc}
      }else{inc=c0*d*(1-num(p.tassa)/100);p.cap=c0+inc}
      p.intTot=num(p.intTot)+inc;
    }
    p.cap=r2(p.cap);p.intTot=r2(num(p.intTot));if(num(p.qty)>0)p.qty=Math.round(num(p.qty)*1e8)/1e8;
    p.accDa=t;p.agg=t;changed=true;
  });
  if(changed)save();
}
function intOggi(){return sum(S.pos,function(p){if(!accrues(p)||ACC.indexOf(p.tipo)<0)return 0;var d=num(p.cap)*tEff(p)/100/365;return p.tipo==='staking'?d:d*(1-num(p.tassa)/100)})}
function intTotale(){return sum(S.pos,function(p){return num(p.intTot)})}
function payPos(f){if(f.piatt==='Trade Republic')return cashPos();return S.pos.filter(function(p){return p.piatt===f.piatt&&(p.tipo==='conto'||p.tipo==='fermi')})[0]||null}
function runFisse(){
  var now=new Date(),ty=now.getFullYear(),tm=now.getMonth(),td=now.getDate(),changed=false;
  S.fisse.forEach(function(f){
    var g=num(f.giorno);
    if(f.freq==='anno'){
      var mo=num(f.mese);if(!(g>=1)||!(mo>=1)||!(num(f.imp)>0))return;
      var dueY=function(y){return y+'-'+pad(mo)+'-'+pad(Math.min(g,pmonthLen(y,mo-1)))<=today()};
      if(!f.ult){f.ult=String(dueY(ty)?ty:ty-1);changed=true;return}
      for(var yy=+f.ult+1;yy<=ty&&yy-+f.ult<=5;yy++){
        if(!dueY(yy))break;
        var pa=payPos(f),lw=false;
        if(pa){lw=num(pa.cap)<num(f.imp);pa.cap=Math.max(0,r2(num(pa.cap)-num(f.imp)));pa.agg=today()}
        f.ult=String(yy);changed=true;
        logOp('Addebito '+f.nome+': -'+eur2(num(f.imp))+(pa?' da '+pa.nome:'')+(lw?' (saldo insufficiente: controlla)':''));
      }
      return;
    }
    if(!(g>=1)||!(num(f.imp)>0))return;
    var dueNow=td>=Math.min(g,pmonthLen(ty,tm));
    if(!f.ult){f.ult=dueNow?pacKey(ty,tm):pacKey(ty,tm-1);changed=true;return}
    var y=+f.ult.slice(0,4),m=+f.ult.slice(5,7)-1;
    for(var guard=0;guard<36;guard++){
      m++;if(m>11){m=0;y++}
      if(y>ty||(y===ty&&m>tm))break;
      if(y===ty&&m===tm&&!dueNow)break;
      var p=payPos(f),low=false;
      if(p){low=num(p.cap)<num(f.imp);p.cap=Math.max(0,r2(num(p.cap)-num(f.imp)));p.agg=today()}
      f.ult=pacKey(y,m);changed=true;
      logOp('Addebito '+f.nome+': -'+eur2(num(f.imp))+(p?' da '+p.nome:'')+(low?' (saldo insufficiente: controlla)':''));
    }
  });
  if(changed)save();
}
function runPac(){
  var now=new Date(),ty=now.getFullYear(),tm=now.getMonth(),td=now.getDate(),changed=false,msgs=[];
  S.pos.forEach(function(p){
    var g=num(p.pacGiorno),pm=num(p.pmt);if(!(pm>0&&g>=1))return;
    var dueNow=td>=Math.min(g,pmonthLen(ty,tm));
    if(!p.pacUlt){p.pacUlt=dueNow?pacKey(ty,tm):pacKey(ty,tm-1);changed=true;return}
    var y=+p.pacUlt.slice(0,4),m=+p.pacUlt.slice(5,7)-1;
    for(var guard=0;guard<36;guard++){
      m++;if(m>11){m=0;y++}
      if(y>ty||(y===ty&&m>tm))break;
      if(y===ty&&m===tm&&!dueNow)break;
      p.cap=r2(num(p.cap)+pm);if(num(p.qty)>0&&p.cg&&num(p.px)>0)p.qty=Math.round((num(p.qty)+pm/num(p.px))*1e8)/1e8;if(num(p.nom)>0)p.nom=r2(num(p.nom)+pm);p.agg=today();
      var src=pacSrc(p),low=false;
      if(src&&src.id!==p.id){low=num(src.cap)<pm;src.cap=Math.max(0,r2(num(src.cap)-pm));src.agg=today()}
      p.pacUlt=pacKey(y,m);changed=true;
      logOp('Piano '+p.nome+': +'+eur2(pm)+(src?' da '+src.nome:'')+(low?' (saldo insufficiente: controlla)':''));
      msgs.push(p.nome);
    }
  });
  if(changed)save();
  if(msgs.length)toast('Piani di accumulo eseguiti: '+msgs.length+(msgs.length===1?' versamento':' versamenti')+'. Controlla il saldo del cash.');
  return msgs.length;
}
function proxCard(){
  var ev=[];
  S.pos.forEach(function(p){var g=num(p.pacGiorno);if(num(p.pmt)>0&&g>=1)ev.push({d:nextOcc(g),n:p.nome,a:num(p.pmt),k:'Piano di accumulo'})});
  S.fisse.forEach(function(f){var g=num(f.giorno);if(g>=1&&f.freq!=='anno')ev.push({d:nextOcc(g),n:f.nome,a:num(f.imp),k:'Uscita fissa'});else if(g>=1&&f.freq==='anno'&&num(f.mese)>=1)ev.push({d:nextOccA(g,num(f.mese)),n:f.nome,a:num(f.imp),k:'Uscita annuale'})});
  if(!ev.length)return '';
  ev.sort(function(a,b){return a.d<b.d?-1:(a.d>b.d?1:0)});
  var plans=sum(S.pos,function(p){return num(p.pacGiorno)>=1?num(p.pmt):0});
  return '<div class="sechead"><h2>Prossimi addebiti automatici</h2></div><div class="card" style="padding:4px 14px">'+ev.slice(0,12).map(function(e){
    return '<div class="sc"><div class="t"><b>'+esc(e.n)+'</b><span class="mu">'+esc(e.k)+'</span></div><span class="d">'+esc(dsh(e.d))+'</span><b>'+esc(eur2(e.a))+'</b></div>'}).join('')+
    (plans>0?'<div class="row" style="padding:10px 0 6px"><span class="mu">Piani di accumulo al mese</span><b>'+eur2(plans)+'</b></div><div class="note" style="margin:0 0 10px">I piani non sono spese: spostano i soldi dal cash agli investimenti. L\'app li applica da sola alla data indicata.</div>':'')+'</div>';
}
function fDett(id){
  var p=findP(id);if(!p)return;var tp=TIPI[p.tipo]||TIPI.fermi;
  var cap=num(p.cap),nom=num(p.nom),pm=num(p.pmt),g=num(p.pacGiorno);
  var r=function(a,b){return '<div class="row"><span class="mu">'+a+'</span><b>'+b+'</b></div>'};
  var h='<div class="mu">'+esc(p.piatt)+' · '+esc(tp.n)+'</div><div class="card">';
  h+=r('Valore oggi',eur2(cap));
  if(nom>0){
    if(p.tipo==='buono')h+=r('Valore nominale',eur2(nom));
    else h+=r('Versato finora',eur2(nom))+r('Guadagno o perdita',(cap-nom>=0?'+':'')+eur2(cap-nom)+' ('+pc((cap/nom-1)*100)+')');
  }
  h+='</div>';
  if(pm>0){
    var src=pacSrc(p);
    h+='<div class="card"><h2>Versamento automatico</h2>'+r('Importo',eur2(pm)+' al mese')+
      (g>=1?r('Giorno',g+' del mese')+r('Prossimo',dt(nextOcc(g))):'<div class="note">Imposta il giorno in Modifica per renderlo automatico.</div>')+
      r('Pagato da',src?esc(src.nome):'non scalato da nessun saldo')+'</div>';
  }
  var net=cap*(tEff(p)-num(p.costi))/100*(1-num(p.tassa)/100)/12;
  h+='<div class="card"><h2>Cos\'\u00e8 e come lo calcolo</h2><div class="mu">'+esc(INFO_TIPO[p.tipo]||'')+'</div>'+(num(p.tetto)>0?'<div class="mu" style="margin-top:8px">Tasso a livelli: '+esc(pc(num(p.tasso)))+' fino a '+esc(eur(num(p.tetto)))+', poi '+esc(pc(num(p.tassoOltre)))+'.</div>':'')+(num(p.qty)>0&&p.cg?'<div class="mu" style="margin-top:8px">Valore = '+esc(String(num(p.qty)))+' monete \u00d7 prezzo del giorno'+(p.px?' ('+esc(eur(p.px))+').':'.')+'</div>':'')+'</div>';
  h+=(num(p.intTot)>0?'<div class="card"><h2>Interessi accreditati dall\'app</h2>'+r('Totale da quando li segna',eur2(num(p.intTot)))+(accrues(p)&&ACC.indexOf(p.tipo)>=0?r('Oggi circa',eur2(num(p.cap)*tEff(p)/100/365*(p.tipo==='staking'?1:1-num(p.tassa)/100))):'')+'</div>':'')+'<div class="card"><h2>Rendimento ipotizzato</h2>'+r('Tasso lordo annuo',pc(num(p.tasso)))+(num(p.costi)?r('Costi annui',pc(num(p.costi))):'')+r('Tasse sul guadagno',pc(num(p.tassa)))+r('Crescita netta stimata al mese',eur2(net))+
    '<div class="note">'+(p.bloccato?'Vincolato fino alla scadenza. ':'')+(p.variabile?'Tasso variabile: può cambiare. ':'')+'Sono ipotesi tue, non garanzie.</div></div>';
  var T=yearsTo(p);
  if(p.scad){var v=valueAt(p,T);h+='<div class="card"><h2>A scadenza</h2>'+r('Scadenza',esc(dt(p.scad)))+r('Netto stimato',eur2(v.netto))+r('Guadagno netto stimato',eur2(v.netto-v.inv))+'</div>'}
  else{
    var rows=[1,5,10,20].filter(function(y){return T==null||y<=T}).map(function(y){var v=valueAt(p,y);return r('Tra '+y+(y===1?' anno':' anni'),eur2(v.netto)+' <span class="mu">(versati '+esc(eur2(v.inv))+')</span>')}).join('');
    if(rows)h+='<div class="card"><h2>Previsione netta</h2>'+rows+'</div>';
  }
  sheetOpen(esc(p.nome),h+'<p style="display:flex;gap:8px;flex-wrap:wrap"><button class="pri" onclick="openForm(\''+esc(p.id)+'\')">Modifica</button><button class="sec" onclick="closeForm()">Chiudi</button></p>');
}

function promptText(){
  var data={oggi:today(),posizioni:S.pos.map(function(p){return {nome:p.nome,piattaforma:p.piatt,tipo:(TIPI[p.tipo]||{}).n,capitale:num(p.cap),tasso_lordo:num(p.tasso),tasse:num(p.tassa),costi:num(p.costi),scadenza:p.scad||null,orizzonte_anni:p.orizz||null,versamento_mensile:num(p.pmt),variabile:!!p.variabile,vincolato:!!p.bloccato}}),uscite_fisse:S.fisse.map(function(f){return {nome:f.nome,importo:num(f.imp),frequenza:f.freq,categoria:f.cat,piattaforma:f.piatt}}),obiettivi:S.set.target,soglie:{piattaforma:S.set.maxPiatt,cripto:S.set.maxCripto}};
  return 'Ti incollo il mio portafoglio personale (inserito a mano, in euro). Analizzalo in italiano, con elenco puntato breve: (1) cosa è inefficiente (soldi fermi, concentrazioni, scadenze, tassi variabili); (2) alternative da valutare, cercando sul web i prodotti e i tassi attuali disponibili in Italia (buoni postali, BTP, conti remunerati, ETF), con ragionamenti condizionali del tipo "se i tassi scendono, allora...". Non prevedere i mercati, non garantire rendimenti, indica le fonti e ricorda che non è consulenza finanziaria personalizzata. Dati: '+JSON.stringify(data);
}
function copyPrompt(){
  var msg=document.getElementById('aiMsg');var t=promptText();
  try{navigator.clipboard.writeText(t).then(function(){msg.textContent='Riepilogo copiato. Incollalo in una chat con Claude.'},function(){msg.textContent='Copia non riuscita.'})}catch(e){msg.textContent='Copia non riuscita.'}
}
